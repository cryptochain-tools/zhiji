[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiji-sdk"
version = "0.1.0"
description = "Stdlib-only server SDK for Zhiji telemetry"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zhiji contributors" }]
keywords = ["analytics", "error-monitoring", "observability", "telemetry"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/cryptochain-tools/zhiji"
Documentation = "https://github.com/cryptochain-tools/zhiji/blob/main/README.md"
Source = "https://github.com/cryptochain-tools/zhiji"
Issues = "https://github.com/cryptochain-tools/zhiji/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
